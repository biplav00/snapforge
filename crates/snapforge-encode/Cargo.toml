[package]
name = "snapforge-encode"
version = "1.3.9"
edition = "2021"
publish = false

[dependencies]
snapforge-domain = { path = "../snapforge-domain" }
snapforge-capture = { path = "../snapforge-capture" }
snapforge-storage = { path = "../snapforge-storage" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
rayon = { workspace = true }
thiserror = "2"
tracing = { workspace = true }

# F_SETNOSIGPIPE on ffmpeg's stdin pipe (see record/ffmpeg.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
