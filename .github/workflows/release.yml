name: release

# Release only commits that passed CI: this runs when the CI workflow finishes
# for a push to main, and only if it succeeded. Everything below builds and
# tags the exact commit CI tested (workflow_run.head_sha), not whatever main
# points at by the time this job starts.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Default to read-only; only the job that pushes the tag and creates the
# GitHub release gets contents: write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          !contains(github.event.workflow_run.head_commit.message, '[skip release]') &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    outputs:
      next: ${{ steps.ver.outputs.next }}
      tag: ${{ steps.ver.outputs.tag }}
      prev_tag: ${{ steps.ver.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute next version (patch bump)
        id: ver
        run: |
          set -euo pipefail
          # Anchor on the HIGHEST release tag in the repo — the source of truth
          # for the shipped version. Deliberately not `git describe`: that only
          # sees tags reachable from head_sha, so if an earlier run's bump
          # commit never reached main (main moved on), describe would recompute
          # an already-published version and `git tag` would fail forever.
          # fetch-depth: 0 above brings all tags; the workflow-level
          # concurrency group serialises runs so two can't pick the same NEXT.
          PREV_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          CURRENT=${PREV_TAG#v}
          CURRENT=${CURRENT:-0.0.0}
          IFS='.' read -r MAJOR MINOR PATCH <<<"$CURRENT"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "prev_tag=$PREV_TAG" >>"$GITHUB_OUTPUT"
          echo "next=$NEXT" >>"$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >>"$GITHUB_OUTPUT"
          echo "Bumping ${CURRENT} -> ${NEXT} (previous tag: ${PREV_TAG:-none})"

  dmg:
    name: Build .dmg
    needs: version
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Qt6 + bundling deps
        run: brew install qt dylibbundler ffmpeg

      - name: Cache cargo registry & target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Same edit the release job commits, applied here so the bundle carries
      # the new version.
      - name: Bump version in CMakeLists.txt
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: packaging/ci/bump-version.sh "$NEXT"

      # Single source of truth: same script developers run locally. Builds
      # release (cargo + cmake), bundles, signs, VERIFIES, and packages.
      - name: Build .dmg
        run: packaging/macos/build_dmg.sh

      # GPL compliance: ship the exact upstream source (+ Homebrew build
      # recipe and patches) of FFmpeg and every bundled GPL/LGPL library next
      # to the DMG. Runs right after the build, against the same Homebrew
      # install the bundle was made from; fails if an installed version and
      # the fetched source disagree. Qt's source is covered by the written
      # offer in THIRD_PARTY_NOTICES.md (see packaging/macos/collect-sources.sh).
      - name: Collect third-party sources
        run: packaging/macos/collect-sources.sh qt/build/Snapforge.app qt/build/dist

      - name: Upload .dmg + sources artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapforge-dmg
          path: |
            qt/build/dist/Snapforge-*.dmg
            qt/build/dist/Snapforge-*-third-party-sources.tar.gz
          if-no-files-found: error

  release:
    name: Tag & publish release
    # Only after the DMG built and verified: a failed build leaves no tag and
    # no empty release behind.
    needs: [version, dmg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in CMakeLists.txt
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: packaging/ci/bump-version.sh "$NEXT"

      - name: Commit, tag, push
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qt/CMakeLists.txt
          git commit -m "chore(release): v$NEXT"
          git tag "v$NEXT"
          git push origin "v$NEXT"
          # Fast-forward main to the bump commit. If main moved on since CI
          # tested head_sha, the tag/release still point at the tested commit;
          # the next release computes its version from the highest tag (not
          # from main's CMakeLists), so a skipped bump on main is cosmetic.
          if ! git push origin "HEAD:main"; then
            echo "::warning::main advanced since the tested commit; version bump not pushed to main (tag v$NEXT still published)"
          fi

      - name: Download .dmg artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapforge-dmg
          path: dist

      - name: Create GitHub Release with .dmg + third-party sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.version.outputs.next }}
          PREV_TAG: ${{ needs.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          # --notes-start-tag only when there IS a previous release; on the
          # first release generate notes from the whole history.
          START_TAG_ARGS=()
          if [ -n "$PREV_TAG" ]; then
            START_TAG_ARGS=(--notes-start-tag "$PREV_TAG")
          fi
          # Both assets must be present: never publish a GPL binary without
          # its source archive.
          ls dist/Snapforge-"$NEXT".dmg dist/Snapforge-"$NEXT"-third-party-sources.tar.gz
          gh release create "v$NEXT" \
            dist/Snapforge-"$NEXT".dmg \
            dist/Snapforge-"$NEXT"-third-party-sources.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$NEXT" \
            --verify-tag \
            --generate-notes \
            "${START_TAG_ARGS[@]}"
