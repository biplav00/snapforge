name: release

# A release is cut only after a push to production passed CI. production only
# receives merges from main through the promotion PR, so this is the final gate
# between staging and a published release. Everything below builds and tags
# the exact commit CI tested (workflow_run.head_sha), not whatever production
# points at by the time this job starts.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]

# Default to read-only; only the job that pushes the tag and creates the
# GitHub release gets contents: write.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'production' &&
          !contains(github.event.workflow_run.head_commit.message, '[skip release]') &&
          !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-24.04
    outputs:
      next: ${{ steps.ver.outputs.next }}
      tag: ${{ steps.ver.outputs.tag }}
      prev_tag: ${{ steps.ver.outputs.prev_tag }}
      bump: ${{ steps.ver.outputs.bump }}
      stale: ${{ steps.current.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check production still points at the tested commit
        id: current
        run: |
          set -euo pipefail
          git fetch --no-tags origin production
          if [ "$(git rev-parse origin/production)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::production moved past the tested commit; skipping this release run"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next semantic version
        id: ver
        if: steps.current.outputs.stale == 'false'
        run: |
          set -euo pipefail
          packaging/ci/next-version.sh | tee version.env

          prev_tag=""
          bump=""
          next=""
          tag=""
          while IFS='=' read -r key value; do
            case "$key" in
              prev_tag) prev_tag="$value" ;;
              bump) bump="$value" ;;
              next) next="$value" ;;
              tag) tag="$value" ;;
            esac
          done < version.env

          {
            echo "prev_tag=$prev_tag"
            echo "bump=$bump"
            echo "next=$next"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          echo "### Release $tag ($bump bump)" >> "$GITHUB_STEP_SUMMARY"
          echo "Previous tag: ${prev_tag:-none}" >> "$GITHUB_STEP_SUMMARY"

  dmg:
    name: Build .dmg
    needs: version
    if: ${{ needs.version.outputs.stale == 'false' }}
    # macos-15 is the current arm64 GitHub-hosted image; macos-14 was retired
    # on 2026-11-02. The deployment target stays 14.0 below.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # Homebrew otherwise spends time on auto-update/cleanup on every run.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # Ninja is preinstalled on the macOS runner; qt/build.sh inherits this
      # default generator, which has less build overhead than Makefiles.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Qt6 + bundling deps
        # qtbase provides the Qt modules the app uses and macdeployqt; the
        # `qt` meta-formula would also install WebEngine, 3D, Charts, etc.
        run: brew install qtbase dylibbundler ffmpeg

      - name: Cache cargo registry & target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Same edit the release job commits, applied here so the bundle carries
      # the new version.
      - name: Bump version in CMakeLists.txt
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: packaging/ci/bump-version.sh "$NEXT"

      # Single source of truth: same script developers run locally. Builds
      # release (cargo + cmake), bundles, signs, VERIFIES, and packages.
      - name: Build .dmg
        run: packaging/macos/build_dmg.sh

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapforge-dmg
          path: qt/build/dist/Snapforge-*.dmg
          if-no-files-found: error

  release:
    name: Tag & publish release
    # Only after the DMG built and verified: a failed build leaves no tag and
    # no empty release behind.
    needs: [version, dmg]
    if: ${{ needs.version.outputs.stale == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-check production before tagging
        run: |
          set -euo pipefail
          git fetch --no-tags origin production
          if [ "$(git rev-parse origin/production)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::production moved during the build; aborting this release run"
            exit 1
          fi

      - name: Bump version in CMakeLists.txt
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: packaging/ci/bump-version.sh "$NEXT"

      - name: Update CHANGELOG.md
        env:
          NEXT: ${{ needs.version.outputs.next }}
          PREV_TAG: ${{ needs.version.outputs.prev_tag }}
        run: packaging/ci/update-changelog.sh "$NEXT" "$PREV_TAG"

      - name: Commit the release changes
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qt/CMakeLists.txt CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No version/changelog changes to commit; tagging the current commit."
          else
            git commit -m "chore(release): v$NEXT"
          fi

      - name: Download .dmg artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6.1.0
        with:
          name: snapforge-dmg
          path: dist

      - name: Verify release assets
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          set -euo pipefail
          ls -lh "dist/Snapforge-$NEXT.dmg"

      - name: Build release notes from CHANGELOG.md
        env:
          NEXT: ${{ needs.version.outputs.next }}
          PREV_TAG: ${{ needs.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          awk -v marker="## [$NEXT]" '
            index($0, marker) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          {
            echo
            echo "**Full changelog:** [\`CHANGELOG.md\`](https://github.com/$GITHUB_REPOSITORY/blob/v$NEXT/CHANGELOG.md)"
            if [ -n "$PREV_TAG" ]; then
              echo
              echo "**Compare:** https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...v$NEXT"
            fi
          } >> release-notes.md
          cat release-notes.md

      - name: Tag and push the release
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::tag v$NEXT already exists; refusing to reuse it"
            exit 1
          fi
          git tag "v$NEXT"

          # Move production to the tagged release commit and publish the tag in
          # one atomic push: either both happen or neither does. production is
          # a fast-forward from the CI-tested merge commit.
          git push --atomic origin "HEAD:production" "refs/tags/v$NEXT"

          # Keep main (staging) in sync when it hasn't moved since the
          # promotion. If it has, the release still publishes; the next
          # promotion/release will fast-forward main over the release commit.
          if ! git push origin "HEAD:main"; then
            echo "::warning::main advanced since the promoted commit; release commit not pushed to main (tag v$NEXT still published)"
          fi

      - name: Create GitHub Release with .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          set -euo pipefail
          gh release create "v$NEXT" \
            "dist/Snapforge-$NEXT.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$NEXT" \
            --notes-file release-notes.md \
            --verify-tag
