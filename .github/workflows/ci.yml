name: CI

on:
  # Promotion PRs target production and point at a commit that already ran CI
  # on the main push. Exclude them at the event level: a job-level skip still
  # creates a run that waits in "action required" (GITHUB_TOKEN opens the PR)
  # and shows a red X. The production push run after the merge is the gate.
  pull_request:
    branches-ignore: [production]
  push:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks that don't need macOS: formatting, dependency policy, and the
  # non-macOS fallback code. This runs alongside the macOS build, so the slow
  # parts (installing cargo-deny, checking the Windows target) are off the
  # critical path.
  policy:
    name: Policy & cross-target checks
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny is a source install (~2.5 min); cache the binary so only a
      # version bump pays that cost.
      - name: Cache cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}

      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        # Pinned so a new cargo-deny release can't break CI unannounced.
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: rustfmt (check)
        run: cargo fmt --all --check

      # Cheap, dependency-free checks for the scripts that drive versioning
      # and CHANGELOG.md generation.
      - name: Release tooling tests
        run: packaging/ci/tests/run.sh

      - name: cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny check

      - name: Cache cargo (Windows target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      # The non-macOS fallback code (cfg(not(target_os = "macos"))) is never
      # compiled by the macOS build above; type-check it for Windows so it
      # can't rot. Warnings are errors, as for clippy below.
      - name: cargo check (Windows target, non-macOS fallbacks)
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --workspace --target x86_64-pc-windows-msvc --all-targets

  build:
    name: Build & test (macOS)
    if: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    # macos-15 is the current arm64 GitHub-hosted image; macos-14 was retired
    # on 2026-11-02. The deployment target stays 14.0 below.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Keep in sync with CMAKE_OSX_DEPLOYMENT_TARGET / LSMinimumSystemVersion.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # Homebrew otherwise spends time on auto-update/cleanup on every run.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo registry & target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # qtbase is all the app uses (Widgets/Gui/Concurrent/Test + macdeployqt).
      # The `qt` formula is a meta-package that also pulls in WebEngine,
      # Declarative, 3D, Charts, etc. — ~1 GB we never compile or link.
      # ffmpeg is a runtime subprocess and dylibbundler is only used when
      # SNAPFORGE_BUNDLE=ON (the release workflow).
      - name: Install Qt6
        run: brew install qtbase

      # --- Quality gates ---------------------------------------------------
      # Formatting, dependency policy, and the Windows-target check run in the
      # parallel `policy` job above. Keep the expensive macOS build focused.
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --- Build & test ----------------------------------------------------
      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: Build snapforge-ffi (release)
        run: cargo build --release -p snapforge-ffi

      # BUILD_TESTING=ON builds the QTest suite; SNAPFORGE_BUNDLE stays OFF
      # (bundling/signing is exercised by the release workflow's DMG build).
      # Ninja is preinstalled on the macOS runner and has less build overhead
      # than the default Makefiles generator.
      - name: Configure Qt build
        run: cmake -S qt -B qt/build -G Ninja -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)" -DBUILD_TESTING=ON

      - name: Build Qt app + tests
        run: cmake --build qt/build --parallel

      - name: Qt tests (ctest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir qt/build --output-on-failure
