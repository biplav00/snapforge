name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (macOS)
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: macos-14
    env:
      # Keep in sync with CMAKE_OSX_DEPLOYMENT_TARGET / LSMinimumSystemVersion.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt6 + bundling deps
        run: brew install qt dylibbundler ffmpeg

      - name: Cache cargo registry & target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # --- Quality gates ---------------------------------------------------
      # Run formatting + lint checks first: they're cheap and catch the most
      # common issues before we pay for the full test + Qt build below.
      - name: rustfmt (check)
        run: cargo fmt --all --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The non-macOS fallback code (cfg(not(target_os = "macos"))) is never
      # compiled by the macOS build above; type-check it for Windows so it
      # can't rot. Warnings are errors, as for clippy above.
      - name: cargo check (Windows target, non-macOS fallbacks)
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --workspace --target x86_64-pc-windows-msvc --all-targets

      - name: Install cargo-deny
        # Pinned so a new cargo-deny release can't break CI unannounced.
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny check

      # --- Build & test ----------------------------------------------------
      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: Build snapforge-ffi (release)
        run: cargo build --release -p snapforge-ffi

      # BUILD_TESTING=ON builds the QTest suite; SNAPFORGE_BUNDLE stays OFF
      # (bundling/signing is exercised by the release workflow's DMG build).
      - name: Configure Qt build
        run: cmake -S qt -B qt/build -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DBUILD_TESTING=ON

      - name: Build Qt app + tests
        run: cmake --build qt/build --parallel

      - name: Qt tests (ctest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir qt/build --output-on-failure
